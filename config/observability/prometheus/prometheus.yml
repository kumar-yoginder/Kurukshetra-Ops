{
  "global": {
    "scrape_interval": "60s",
    "evaluation_interval": "60s"
  },
  "scrape_configs": [
    {
      "job_name": "prometheus",
      "static_configs": [
        {
          "targets": [
            "127.0.0.1:9090"
          ],
          "labels": {
            "instance": "metrics-store"
          }
        }
      ]
    },
    {
      "job_name": "alloy",
      "static_configs": [
        {
          "targets": [
            "alloy:12345"
          ],
          "labels": {
            "instance": "collector"
          }
        }
      ]
    }
  ],
  "rule_files": [
    "/etc/prometheus/rules.yml"
  ]
}
