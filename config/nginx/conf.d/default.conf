map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl;
    server_name _;

    # This is the Docker internal DNS IP
    resolver 127.0.0.11 valid=30s;

    types {
        application/wasm    wasm;
        application/javascript js;
    }

    # Use your custom log format here!
    access_log /var/log/nginx/access.log combined;

    # Performance for ELK
    proxy_read_timeout 600;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_client_certificate /etc/nginx/certs/ca.crt;

    # Change 'on' to 'off' to disable mTLS
    ssl_verify_client off;

    # Performance & Large File Streaming
    client_max_body_size 10G;        # Allow large uploads/streams
    proxy_buffering off;              # Better for real-time streaming
    proxy_request_buffering off;
    sendfile on;
    tcp_nopush on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /nginx_status {
        stub_status;
    }

    # 1. Pi-hole Admin Interface
    location /admin/ {
        proxy_pass http://pihole:80/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Prevent Pi-hole from redirecting back to its internal hostname
        proxy_redirect off;
    }

    # 2. Universal Pi-hole API Catch
    location /api/ {
        proxy_pass http://pihole:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /kibana/ {
        # NO trailing slash here if Kibana is handling the basepath
        proxy_pass http://kibana:5601; 
    
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    
        # This header helps Kibana know it's being proxied
        proxy_set_header x-found-handling 'kibana';

        # Essential for large Kibana JS bundles
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 4. Elasticsearch API
    location /elastic/ {
        rewrite ^/elastic/(.*)$ /$1 break;
        proxy_pass http://elasticsearch:9200;
        proxy_set_header Host $host;
    }

}
