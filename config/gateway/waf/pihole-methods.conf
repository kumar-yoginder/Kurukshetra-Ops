# Pi-hole 6 OpenAPI operations only. Authentication and exact-Origin checks remain downstream.
# Remove only CRS method-policy rule 911100; all other request rules remain enabled.
SecRule REQUEST_METHOD "@streq DELETE" "id:110010,phase:1,pass,nolog,chain"
    SecRule REQUEST_URI "@rx ^/api/auth/session/[^/?]+(?:\?.*)?$" "ctl:ruleRemoveById=911100"

