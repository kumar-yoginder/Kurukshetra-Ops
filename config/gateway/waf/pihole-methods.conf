# Authelia vendor assets contain .Password; exclude only filename inspection for these exact assets.
SecRule REQUEST_METHOD "@rx ^(?:GET|HEAD)$" "id:110100,phase:1,pass,nolog,chain"
    SecRule REQUEST_URI "@rx ^/auth/static/js/(?:hooks\.PasswordVisibility\.BkfT-6fZ|components\.PasswordVisibilityToggle\.Dnw544Qt)\.js$" "ctl:ruleRemoveTargetById=930130;REQUEST_FILENAME"

# Existing client downloads are data, never executable server-side. Central authorization is still required.
SecRule REQUEST_METHOD "@rx ^(?:GET|HEAD)$" "id:110101,phase:1,pass,nolog,chain"
    SecRule REQUEST_URI "@rx ^/client/(?:ubuntu/(?:tor-client|trial|open-tor-browser)\.sh|windows/(?:windows-tor|open-tor-browser|install-shortcuts)\.ps1)$" "ctl:ruleRemoveById=920440"
