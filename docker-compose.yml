---
name: kurukshetra-ops
services:
  cert-gen:
    profiles: [gateway]
    image: alpine:latest
    container_name: cert-gen
    volumes:
      - ./certs:/certs
    deploy:
      resources:
        limits:
          memory: 50M
    entrypoint: /bin/sh
    command:
      - -c
      - >
        apk add --no-cache openssl &&

        printf '%s\n' '[v3_server]' 'subjectAltName=DNS:dwarka.gateway,IP:${PIHOLE_LAN_IP:?Set PIHOLE_LAN_IP in private .env}' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > /certs/server-ext.cnf &&

        if [ ! -f /certs/ca.crt ]; then
          openssl genrsa -out /certs/ca.key 4096 &&
          openssl req -x509 -new -nodes -key /certs/ca.key -sha256 -days 3650 \
            -out /certs/ca.crt \
            -subj '/C=IN/ST=KA/L=BLR/O=Kurukshetra-Ops/OU=Divine-Command/CN=Kurukshetra-Root-CA' &&
          openssl genrsa -out /certs/server.key 2048 &&
          openssl req -new -key /certs/server.key \
            -out /certs/server.csr \
            -subj '/C=IN/ST=KA/L=BLR/O=Kurukshetra-Ops/OU=Dwarka-Gateway/CN=dwarka.gateway' &&
          openssl x509 -req -in /certs/server.csr \
            -CA /certs/ca.crt -CAkey /certs/ca.key -CAcreateserial \
            -out /certs/server.crt -days 365 -sha256 \
            -extfile /certs/server-ext.cnf -extensions v3_server;
        fi;

        echo 'Certificates verified. Entering standby...' && tail -f /dev/null
    healthcheck:
      test:
        - CMD
        - test
        - -f
        - /certs/server.crt
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      - TZ=Asia/Kolkata
      # The host systemd-timesyncd service manages the shared system clock.
      - FTLCONF_ntp_sync_active=false
      - FTLCONF_webserver_api_password=${PIHOLE_API_PASSWORD:?Set PIHOLE_API_PASSWORD in private .env}
      - FTLCONF_dns_listeningMode=ALL
      - FTLCONF_dns_hosts=${PIHOLE_LAN_IP:?Run ./deploy.sh --configure-only first} dwarka.gateway kurukshetra.lan;${ADDITIONAL_DNS_HOSTS:-}
      - INTERFACE=eth0
    ports:
      - 53:53/tcp
      - 53:53/udp
    volumes:
      - ./data/pihole:/etc/pihole
      - ./config/pihole:/bootstrap:ro
      - ./logs/pihole/pihole.log:/var/log/pihole/pihole.log
    deploy:
      resources:
        limits:
          memory: 256M
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    restart: unless-stopped
  elasticsearch:
    profiles: [monitoring]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s http://localhost:9200/_cluster/health | grep -vq
          '"status":"red"'
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 180s
    restart: unless-stopped
  filebeat:
    profiles: [monitoring]
    image: docker.elastic.co/beats/filebeat:8.10.2
    container_name: filebeat
    user: root
    volumes:
      - ./config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs/nginx:/usr/share/filebeat/logs/nginx:ro
      - ./logs/pihole/pihole.log:/usr/share/filebeat/logs/pihole/pihole.log:ro
    deploy:
      resources:
        limits:
          memory: 150M
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
  kibana:
    profiles: [monitoring]
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
      - SERVER_PUBLICBASEURL="https://dwarka.gateway/kibana"
      - NODE_OPTIONS=--max-old-space-size=1024
      - xpack.security.encryptionKey=something_at_least_32_chars_long_1
      - xpack.encryptedSavedObjects.encryptionKey=something_at_least_32_chars_long_2
      - xpack.reporting.encryptionKey=something_at_least_32_chars_long_3
    deploy:
      resources:
        limits:
          memory: 1500M
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:5601/api/status
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
  nginx:
    profiles: [gateway]
    build:
      context: ./containers/nginx
    image: kurukshetra/nginx-gateway:2026.11.09
    container_name: kurukshetra-gateway
    ports:
      - "443:443"
    volumes:
      - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/server.key:/etc/nginx/certs/server.key:ro
      - ./config/gateway/private/edge:/etc/nginx/conf.d:ro
    networks: [gateway-edge]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=4m
      - /tmp:rw,noexec,nosuid,size=8m
    mem_limit: 128m
    pids_limit: 64
    depends_on:
      gateway-waf:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  identity:
    profiles: [gateway]
    image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    user: "${GATEWAY_UID:-1000}:${GATEWAY_GID:-1000}"
    environment:
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/identity_session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/identity_storage
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/identity_reset_jwt
    secrets: [identity_session, identity_storage, identity_reset_jwt]
    volumes:
      - ./config/gateway/private/identity:/config:ro
      - ./data/identity:/state
      - ./data/identity/healthcheck.env:/app/.healthcheck.env
    networks: [gateway-app]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  web-router:
    profiles: [gateway]
    image: kurukshetra/nginx-gateway:2026.11.09
    volumes:
      - ./config/gateway/private/router:/etc/nginx/conf.d:ro
      - ./config/portal/www:/usr/share/nginx/html:ro
      - ./config/nginx/www:/snapshots:ro
    networks: [gateway-app, default]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=4m
      - /tmp:rw,noexec,nosuid,size=8m
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped
    depends_on:
      identity:
        condition: service_healthy
      pihole-bridge:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  gateway-waf:
    profiles: [gateway]
    image: owasp/modsecurity-crs:nginx@sha256:7698c48a41a43138ae317feeec964d1515b861cc1d9e50617bc1cdfe9f314e1d
    environment:
      BACKEND: http://web-router:8080
      PORT: "8080"
      NGINX_X_FORWARDED_PROTO: https
      NGINX_X_FORWARDED_PORT: "443"
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
      MODSEC_AUDIT_LOG_PARTS: AZ
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_RESP_BODY_ACCESS: "Off"
      MODSEC_REQ_BODY_LIMIT: "2097152"
      MODSEC_REQ_BODY_NOFILES_LIMIT: "2097152"
      MODSEC_REQ_BODY_JSON_DEPTH_LIMIT: "32"
      MODSEC_ARGUMENTS_LIMIT: "1000"
      LOGLEVEL: crit
      SERVER_TOKENS: "off"
    volumes:
      - ./config/gateway/waf/pihole-methods.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./config/gateway/templates/waf/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./config/gateway/templates/waf/logging.conf.template:/etc/nginx/templates/conf.d/logging.conf.template:ro
    networks: [gateway-edge, gateway-app]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 96
    restart: unless-stopped
    depends_on:
      web-router:
        condition: service_started
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  pihole-bridge:
    profiles: [gateway]
    build:
      context: ./containers/pihole-bridge
    image: kurukshetra/pihole-bridge:2026.11.09
    user: "${GATEWAY_UID:-1000}:${GATEWAY_GID:-1000}"
    volumes:
      - ./config/gateway/private/bridge:/config:ro
    secrets: [pihole_password]
    networks: [gateway-app, default]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 48
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  tor-gateway:
    profiles: [tor]
    build:
      context: ./containers/tor-gateway
    image: kurukshetra/tor-gateway:2026.10.23.2
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=8m
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    ports:
      # Safe default: loopback only. Set TOR_BIND_IP in ignored .env after review.
      - "${TOR_BIND_IP:-127.0.0.1}:51820:51820/udp"
    volumes:
      - type: bind
        source: ./config/tor-gateway/wg0.conf
        target: /run/wireguard/wg0.conf
        read_only: true
        bind:
          create_host_path: false
      - tor-gateway-state:/var/lib/tor
    networks: [tor-egress]
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck.py]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 96
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  router-inventory:
    profiles: [inventory]
    build:
      context: ./containers/router-inventory
      additional_contexts:
        inventory-source: ./scripts/monitoring/router_inventory
        monitoring-entry: ./scripts/monitoring
    image: kurukshetra/router-inventory:2026.11.11
    user: "${INVENTORY_UID:-1000}:${INVENTORY_GID:-1000}"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    environment:
      PRIVATE_BIND: 0.0.0.0
      PRIVATE_DNS_COUNTS_FILE: /dns/dns-counts.json
    secrets:
      - router_username
      - router_password
    volumes:
      - type: bind
        source: ./config/router-inventory/container.json
        target: /app/config/router-inventory/local.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/router-inventory
        target: /app/data/router-inventory
        bind:
          create_host_path: false
      - type: bind
        source: ./data/dns-activity
        target: /dns
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -c, "import json,time,pathlib; d=json.loads(pathlib.Path('/app/data/router-inventory/inventory.json').read_text()); raise SystemExit(0 if d['state']=='available' and time.time()-(d.get('updated') or 0)<180 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 90s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 48
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"

networks:
  gateway-edge:
    driver: bridge
  gateway-app:
    driver: bridge
  tor-egress:
    driver: bridge
volumes:
  tor-gateway-state:
  elasticsearch-data:

secrets:
  router_username:
    file: ./config/router-inventory/secrets/username
  router_password:
    file: ./config/router-inventory/secrets/password
  identity_session:
    file: ./config/gateway/private/secrets/session
  identity_storage:
    file: ./config/gateway/private/secrets/storage
  identity_reset_jwt:
    file: ./config/gateway/private/secrets/reset_jwt
  pihole_password:
    file: ./config/gateway/private/secrets/pihole_password
